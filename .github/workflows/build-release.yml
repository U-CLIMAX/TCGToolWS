name: Build & Release (Tauri)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否创建并发布 GitHub Release'
        type: boolean
        required: true
        default: false
      tag_name:
        description: '自定义 Release Tag（留空则自动读取 tauri.conf.json 版本号）'
        type: string
        required: false
        default: ''
      draft:
        description: '是否为草稿 (Draft Release)'
        type: boolean
        required: false
        default: false
      prerelease:
        description: '是否标记为预发布 (Pre-release)'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. Windows 构建 (.exe 安装包)
  # ==========================================
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Windows App
        run: npm run tauri:build

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: U-CLIMAX-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  # ==========================================
  # 2. Android 构建 (Universal .apk)
  # ==========================================
  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android NDK & SDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Setup Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Setup Android Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Restoring Android Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > src-tauri/uclimax-release.jks
            echo "keyAlias=uclimax" > src-tauri/gen/android/keystore.properties
            echo "password=$KEYSTORE_PASSWORD" >> src-tauri/gen/android/keystore.properties
            echo "storeFile=../../uclimax-release.jks" >> src-tauri/gen/android/keystore.properties
            echo "Android signing configured successfully."
          else
            echo "Warning: ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PASSWORD secret not found. APK will be unsigned/debug fallback."
          fi

      - name: Build Android Universal APK
        run: npm run tauri:android:build

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: U-CLIMAX-Android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # ==========================================
  # 3. Linux 构建 (.AppImage)
  # ==========================================
  build-linux:
    name: Build Linux (.AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Linux AppImage
        run: npm run tauri:build -- --bundles appimage

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: U-CLIMAX-Linux
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

  # ==========================================
  # 4. 发布 GitHub Release (可选)
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    if: ${{ inputs.create_release == true }}
    needs: [build-windows, build-android, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Determine Release Tag
        id: get_tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag will be: $TAG"

      - name: Organize release files
        run: |
          mkdir -p release-files
          find release-assets -type f \( -name "*.exe" -o -name "*.apk" -o -name "*.AppImage" \) -exec cp {} release-files/ \;
          echo "Files to release:"
          ls -lah release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: ${{ steps.get_tag.outputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: release-files/*
