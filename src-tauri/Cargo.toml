[package]
name = "tcgtoolws"
version = "1.0.2"
description = "U CLIMAX 致力于让 Weiβ Schwarz 简中卡查更快速，让构筑与分享卡组更直观高效，为玩家带来流畅的构筑体验。"
authors = [
  "Zhuang <dd8611706@gmail.com>",
  "Yuuzi <lokasu0531@gmail.com>",
  "Kamomim",
  "U-CLIMAX Team",
]
license = "GPL-3.0-or-later"
repository = "https://github.com/U-CLIMAX/TCGToolWS"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-webview-upgrade = { git = "https://github.com/readest/tauri-plugin-webview-upgrade", rev = "bbb5bd33ef4ab644e915f7264ef15a8da97cb284" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

